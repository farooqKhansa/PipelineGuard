services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pipelineguard
      POSTGRES_PASSWORD: pipelineguard
      POSTGRES_DB: pipelineguard
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipelineguard"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://pipelineguard:pipelineguard@db:5432/pipelineguard
      FRONTEND_ORIGINS: http://localhost:3000
      DEMO_MODE: "true"
      GITHUB_WEBHOOK_SECRET: dev-webhook-secret
    ports:
      - "8000:8000"

volumes:
  pg_data:
